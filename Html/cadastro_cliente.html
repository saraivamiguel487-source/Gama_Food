<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamaFood - Cadastro de Cliente</title>

    <!-- Bootstrap e Font Awesome primeiro -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Seu CSS por último para aplicar as cores do Gama -->
    <link rel="stylesheet" href="Css/cadastro_cliente.css">
    <link rel="stylesheet" href="Css/style.css">
</head>

<body>
    <header class="header-gama shadow-sm">
        <div class="container d-flex flex-wrap align-items-center justify-content-between py-3">
            <div class="d-flex align-items-center gap-3">
                <img src="Gama_Food-logo.jpg" alt="Logo do GamaFood" class="logo">
                <h1 class="h3 mb-0 titulo-marca">GamaFood</h1>
            </div>
            <nav>
                <ul class="nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="cadastro_restaurante.html">Cadastrar Restaurante</a></li>
                    <li class="nav-item"><a class="nav-link" href="cadastro_entregador.html">Cadastrar Entregador</a></li>
                    <li class="nav-item"><a class="nav-link" href="login_cliente.html">Login Cliente</a></li>
                    <li class="nav-item"><a class="nav-link" href="login_entregador.html">Login Entregador</a></li>
                    <li class="nav-item"><a class="nav-link" href="recuperar_senha.html">Recuperar Senha</a></li>
                    <li class="nav-item"><a class="nav-link" href="carrinho.html"><i class="fa-solid fa-cart-shopping"></i> Carrinho</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5 d-flex justify-content-center">
        <div class="card card-gama shadow p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="icone-destaque mb-2">
                    <i class="fa-solid fa-user-plus fa-2x"></i>
                </div>
                <h2 class="h4 fw-bold texto-verde-gama">Cadastro de Cliente</h2>
                <p class="text-muted small">Preencha seus dados para pedir delivery no Gama com rapidez.</p>
            </div>

            <!-- Área para alertas dinâmicos do JavaScript -->
            <div id="mensagem-alerta" class="alert d-none" role="alert"></div>

            <form id="form-cadastro-cliente" action="processar_cadastro_cliente.php" method="POST" novalidate>
                <div class="row g-3">
                    <div class="col-12">
                        <label for="nomecompleto" class="form-label fw-semibold">Nome Completo</label>
                        <input type="text" class="form-control" id="nomecompleto" name="nomecompleto" placeholder="Ex: Maria Silva Santos" required>
                    </div>

                    <div class="col-md-6">
                        <label for="cpf" class="form-label fw-semibold">CPF</label>
                        <input type="text" class="form-control" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
                    </div>

                    <div class="col-md-6">
                        <label for="telefone" class="form-label fw-semibold">Telefone / WhatsApp</label>
                        <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="(61) 90000-0000" maxlength="15" required>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="cliente@email.com" required>
                    </div>

                    <div class="col-md-6">
                        <label for="senhahash" class="form-label fw-semibold">Senha</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="senhahash" name="senhahash" placeholder="Mínimo 6 caracteres" required>
                            <button class="btn btn-outline-secondary" type="button" id="toggle-senha" title="Mostrar ou ocultar senha">
                                <i class="fa-solid fa-eye" id="icone-olho"></i>
                            </button>
                        </div>
                    </div>

                    <div class="col-md-5">
                        <label for="quadra_setor" class="form-label fw-semibold">Quadra / Setor</label>
                        <select class="form-select" id="quadra_setor" name="quadra_setor" required>
                            <option value="" selected disabled>Selecione seu setor...</option>
                            <option value="Setor Central">Setor Central</option>
                            <option value="Setor Leste">Setor Leste</option>
                            <option value="Setor Oeste">Setor Oeste</option>
                            <option value="Setor Norte">Setor Norte</option>
                            <option value="Setor Sul">Setor Sul</option>
                            <option value="Setor de Indústria">Setor de Indústria</option>
                            <option value="Ponte Alta">Ponte Alta</option>
                        </select>
                    </div>

                    <div class="col-md-7">
                        <label for="endereco_detalhado" class="form-label fw-semibold">Endereço Detalhado</label>
                        <input type="text" class="form-control" id="endereco_detalhado" name="endereco_detalhado" placeholder="Quadra, Conjunto, Casa/Apto, Ponto de referência" required>
                    </div>

                    <div class="col-md-6">
                        <label for="data_cadastro" class="form-label fw-semibold">Data de Cadastro</label>
                        <input type="date" class="form-control" id="data_cadastro" name="data_cadastro" required>
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" id="btn-cadastrar" class="btn btn-gama w-100 fw-bold py-2">
                        <i class="fa-solid fa-check-circle me-2"></i>Concluir Cadastro
                    </button>
                </div>
            </form>

            <hr class="my-4">

            <p class="text-center mb-0 small">
                Já possui uma conta? <a href="login_cliente.html" class="fw-bold text-decoration-none link-gama">Faça login aqui</a>
            </p>
        </div>
    </main>

    <!-- Removido o integrity inválido para o script local funcionar -->
    <script src="cadastro_cliente.js"></script>
</body>

</html>
