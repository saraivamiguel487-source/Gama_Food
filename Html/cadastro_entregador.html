        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
        <header class="container">
        <h1>GamaFood</h1>
        <nav>
            <img src="Gama_Food-logo.jpg" alt="Logo do GamaFood" class="logo">
            <ul class="nav">
                <li class="nav-item"><a class="nav-link" href="index.html">Voltar ao Início</a></li>

                <li class="nav-item"><a class="nav-link" href="carrinho.html">Carrinho</a></li>
            </ul>
        </nav>
    </header>
    <h1>Cadastro de Entregador</h1>
    <form>
        <div class="mb-3">
            <label for="nome" class="form-label">Nome do Entregador</label>
            <input type="text" class="form-control" id="nome" required>
        </div>
        <div class="mb-3">
            <label for="cpf" class="form-label">CPF</label>
            <input type="text" class="form-control" id="cpf" required>
        </div>
        <div class="mb-3">
            <label for="cnh" class="form-label">CNH</label>
            <input type="text" class="form-control" id="cnh" required>
        </div>
        <div class="mb-3">
            <label for="telefone" class="form-label">Telefone</label>
            <input type="tel" class="form-control" id="telefone" required>
        </div>
        <div class="mb-3">
            <label for="tipo_veiculo" class="form-label">Tipo de Veículo</label>
            <select class="form-select" id="tipo_veiculo" required>
                <option value="">Selecione o tipo de veículo</option>
                <option value="moto">Moto</option>
                <option value="carro">Carro</option>
                <option value="bicicleta">Bicicleta</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="placa_veiculo" class="form-label">Placa do Veículo</label>
            <input type="text" class="form-control" id="placa_veiculo" required>
        </div>
        <div class="mb-3">
            <label for="disponivel" class="form-label">Disponibilidade</label>
            <select class="form-select" id="disponivel" required>
                <option value="">Selecione a disponibilidade</option>
                <option value="sim">Sim</option>
                <option value="nao">Não</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Cadastrar</button>
    </form>
    <script src="cadastro_entregador.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoA6VJ0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
