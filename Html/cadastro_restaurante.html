<body>
        <header class="container">
        <h1>GamaFood</h1>
        <nav>
            <img src="Gama_Food-logo.jpg" alt="Logo do GamaFood" class="logo">
            <ul class="nav">
                <li class="nav-item"><a class="nav-link" href="index.html">Voltar ao Início</a></li>

    <h1>Cadastro de Restaurante</h1>
    <form>
        <div class="mb-3">
            <label for="nome" class="form-label">Nome do Restaurante</label>
            <input type="text" class="form-control" id="nome" required>
        </div>
        <div class="mb-3">
            <label for="endereco" class="form-label">Endereço</label>
            <input type="text" class="form-control" id="endereco" required>
        </div>
        <div class="mb-3">
            <label for="telefone" class="form-label">Telefone</label>
            <input type="tel" class="form-control" id="telefone" required>
        </div>
        <button type="submit" class="btn btn-primary">Cadastrar</button>
    </form>
    <script src="cadastro_restaurante.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoA6VJ0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
