<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamaFood - Login de Cliente</title>

    <!-- Bootstrap e Font Awesome primeiro -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Seu CSS por último para aplicar as cores do Gama -->
    <link rel="stylesheet" href="Css/login_cliente.css">
</head>

<body>
    <header class="header-gama shadow-sm">
        <div class="container d-flex flex-wrap align-items-center justify-content-between py-3">
            <div class="d-flex align-items-center gap-3">
                <img src="Gama_Food-logo.jpg" alt="Logo do GamaFood" class="logo">
                <h1 class="h3 mb-0 titulo-marca">GamaFood</h1>
            </div>
            <nav>
                <ul class="nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="cadastro_restaurante.html">Cadastrar Restaurante</a></li>
                    <li class="nav-item"><a class="nav-link" href="cadastro_entregador.html">Cadastrar Entregador</a></li>
                    <li class="nav-item"><a class="nav-link" href="login_entregador.html">Login Entregador</a></li>
                    <li class="nav-item"><a class="nav-link" href="recuperar_senha.html">Recuperar Senha</a></li>
                    <li class="nav-item"><a class="nav-link" href="carrinho.html"><i class="fa-solid fa-cart-shopping"></i> Carrinho</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container d-flex justify-content-center align-items-center min-vh-75 my-5">
        <div class="card card-gama shadow p-4">
            <div class="text-center mb-4">
                <div class="icone-destaque mb-2">
                    <i class="fa-solid fa-utensils fa-2x"></i>
                </div>
                <h2 class="h4 fw-bold texto-verde-gama">Login de Cliente</h2>
                <p class="text-muted small">Entre para pedir os melhores lanches e refeições do Gama!</p>
            </div>

            <!-- Área para alertas dinâmicos do JavaScript -->
            <div id="mensagem-alerta" class="alert d-none" role="alert"></div>

            <form id="form-login-cliente" action="processar_login_cliente.php" method="POST" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">E-mail:</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-envelope text-success"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="cliente@email.com" required>
                    </div>
                </div>

                <div class="mb-2">
                    <label for="senha" class="form-label fw-semibold">Senha:</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-success"></i></span>
                        <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required>
                        <button class="btn btn-outline-secondary" type="button" id="toggle-senha" title="Mostrar ou ocultar senha">
                            <i class="fa-solid fa-eye" id="icone-olho"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-end mb-4">
                    <a href="recuperar_senha.html" class="small text-decoration-none link-gama">Esqueci minha senha</a>
                </div>

                <button type="submit" id="btn-entrar" class="btn btn-gama w-100 fw-bold py-2">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Entrar
                </button>
            </form>

            <hr class="my-4">

            <p class="text-center mb-0 small">
                Não tem uma conta? <a href="cadastro_cliente.html" class="fw-bold text-decoration-none link-gama">Cadastre-se aqui</a>
            </p>
        </div>
    </main>

    <!-- Bootstrap JS + Seu JS personalizado -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
    <script src="login_cliente.js"></script>
</body>

</html>
